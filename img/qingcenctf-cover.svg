<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">QingCenCTF cover</title>
  <desc id="desc">Black banner with stylized QingCenCTF text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#9dff00" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)" rx="18" />
  <g filter="url(#glow)" font-family="Consolas, 'Courier New', monospace" font-size="126" font-weight="700" text-anchor="middle">
    <text x="600" y="198" letter-spacing="6">
      <tspan fill="#8fff00">[</tspan>
      <tspan fill="#ffffff">QING</tspan>
      <tspan fill="#8fff00">CEN</tspan>
      <tspan fill="#e8ff4d">CTF</tspan>
      <tspan fill="#8fff00">]</tspan>
    </text>
  </g>
</svg>
