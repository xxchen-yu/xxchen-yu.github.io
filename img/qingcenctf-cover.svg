<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350" role="img" aria-labelledby="title desc">
  <title id="title">QingCenCTF cover</title>
  <desc id="desc">Dark banner with light gray QingCen text and lime CTF text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1d23" />
      <stop offset="100%" stop-color="#171a20" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1400" height="350" fill="url(#bg)" rx="10" />
  <g filter="url(#shadow)" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-size="188" font-weight="900">
    <text x="58" y="248" textLength="1268" lengthAdjust="spacingAndGlyphs">
      <tspan fill="#e4e4e4">QING</tspan><tspan fill="#c6ff00">CEN</tspan><tspan fill="#e8ff3a">CTF</tspan>
    </text>
  </g>
</svg>
