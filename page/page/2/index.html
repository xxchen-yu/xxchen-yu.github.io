                    <path d="M10.39 2.7a1 1 0 0 1 1.22-.63l.76.24a1 1 0 0 0 1.26-.57l.33-.73a1 1 0 0 1 1.3-.5l1.42.63a1 1 0 0 1 .5 1.3l-.33.73a1 1 0 0 0 .3 1.21l.62.5a1 1 0 0 1 .16 1.4l-.94 1.17a1 1 0 0 0 0 1.26l.94 1.17a1 1 0 0 1-.16 1.4l-.62.5a1 1 0 0 0-.3 1.21l.33.73a1 1 0 0 1-.5 1.3l-1.42.63a1 1 0 0 1-1.3-.5l-.33-.73a1 1 0 0 0-1.26-.57l-.76.24a1 1 0 0 1-1.22-.63l-.28-.74a1 1 0 0 0-1.15-.62l-.79.13a1 1 0 0 1-1.14-.82l-.24-1.54a1 1 0 0 1 .82-1.14l.79-.13a1 1 0 0 0 .82-.93V9.5a1 1 0 0 0-.82-.93l-.79-.13a1 1 0 0 1-.82-1.14l.24-1.54a1 1 0 0 1 1.14-.82l.79.13a1 1 0 0 0 1.15-.62zM12 9a3 3 0 1 0 0 6a3 3 0 0 0 0-6z" />
                </svg>
            </span>
            <p class="runtime-status-title">
                <span class="runtime-status-label">&#x535A;&#x5BA2;&#x5DF2;&#x8FD0;&#x884C;</span>
                <strong data-runtime-days>96</strong>
                <span class="runtime-status-suffix">&#x5929;</span>
            </p>
        </div>

        <div class="runtime-status-meta">
            <span class="runtime-status-badge">2026</span>
            <span
                class="runtime-status-percent"
                data-runtime-percent
                title="悬停后显示并实时更新到小数点后七位"
            >0.00%</span>
        </div>

        <div class="runtime-status-track" aria-hidden="true">
            <span class="runtime-status-fill" data-runtime-fill></span>
        </div>
    </div>

    <script>
        (() => {
            const card = document.currentScript?.previousElementSibling;

            if (!card || !card.classList.contains('runtime-status-card')) {
                return;
            }

            const startAt = new Date(card.dataset.runtimeStart);
            const progressYear = Number(card.dataset.progressYear);
            const msPerDay = 24 * 60 * 60 * 1000;
            const yearStart = new Date(`${progressYear}-01-01T00:00:00+08:00`);
            const yearEnd = new Date(`${progressYear + 1}-01-01T00:00:00+08:00`);
            const totalMs = yearEnd.getTime() - yearStart.getTime();

            const daysNode = card.querySelector('[data-runtime-days]');
            const percentNode = card.querySelector('[data-runtime-percent]');
            const fillNode = card.querySelector('[data-runtime-fill]');
            let hoverTimer = null;

            const getRuntimeDays = () => {
                const now = new Date();
                return Math.max(0, Math.floor((now.getTime() - startAt.getTime()) / msPerDay));
            };

            const getProgressPercent = () => {
                const now = new Date();
                const elapsedMs = Math.min(Math.max(now.getTime() - yearStart.getTime(), 0), totalMs);
                return totalMs > 0 ? (elapsedMs / totalMs) * 100 : 0;
            };

            const render = (precision = 2) => {
                const percent = getProgressPercent();

                if (daysNode) {
                    daysNode.textContent = String(getRuntimeDays());
                }

                if (percentNode) {
                    percentNode.textContent = `${percent.toFixed(precision)}%`;
                }

                if (fillNode) {
                    fillNode.style.width = `${percent}%`;
                }
            };

            const stopHoverMode = () => {
                if (hoverTimer) {
                    window.clearInterval(hoverTimer);
                    hoverTimer = null;
                }

                card.classList.remove('runtime-status-card--active');
                render(2);
            };

            card.addEventListener('mouseenter', () => {
                stopHoverMode();
                card.classList.add('runtime-status-card--active');
                render(7);
                hoverTimer = window.setInterval(() => render(7), 80);
            });

            card.addEventListener('mouseleave', stopHoverMode);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    stopHoverMode();
                }
            });

            render(2);
        })();
    </script>
</section>

<script>
function initCollapsibleToc() {
    
    
    const topLinks = document.querySelectorAll('.widget--toc nav > ol > li');

    topLinks.forEach(li => {
        
        const subList = li.querySelector('ol, ul');

        if (subList) {
            
            li.addEventListener('click', function(e) {
                
                e.stopPropagation();
                
                
                
                li.classList.toggle('expanded');
            });
        }
    });
}


document.addEventListener('stack:config', initCollapsibleToc);

document.addEventListener('DOMContentLoaded', initCollapsibleToc);
</script>

    content: '+';
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.8em;
    color: #999;
    transition: transform 0.2s;
}

 
.widget--toc .toc .nav > li.active > a::after {
    content: '-';
    color: #333;
}
